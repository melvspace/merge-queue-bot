name: Rebuild release container

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Published stable release tag, for example v0.2.0.
        required: true
        type: string
      publish-latest:
        description: Update latest and minor-version tags; requires the latest stable release.
        type: boolean
        default: false
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string
      expected-sha:
        description: Checked release revision; empty uses the selected release tag.
        type: string
        default: ''
      publish-latest:
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: container-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish AMD64 and ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          PUBLISH_LATEST: ${{ inputs.publish-latest }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease \
            | jq -e '.isDraft == false and .isPrerelease == false' > /dev/null

          if [ "$PUBLISH_LATEST" = true ]; then
            latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')

            if [ "$RELEASE_TAG" != "$latest_tag" ]; then
              echo '::error::Only the latest stable release can update latest and minor-version tags.'
              exit 1
            fi
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release-tag }}
          persist-credentials: false
      - name: Record release revision
        id: release
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          sha=$(git rev-parse HEAD)

          if [ -n "$EXPECTED_SHA" ] && [ "$sha" != "$EXPECTED_SHA" ]; then
            echo '::error::The release tag does not match the checked revision.'
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Container metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.release.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.release-tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release-tag }},enable=${{ inputs.publish-latest }}
            type=raw,value=latest,enable=${{ inputs.publish-latest }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
      - name: Publish container
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - name: Verify published platforms
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          docker buildx imagetools inspect "$IMAGE:${RELEASE_TAG#v}" --raw \
            | jq -e '.manifests | map(.platform | "\(.os)/\(.architecture)") |
              index("linux/amd64") != null and index("linux/arm64") != null'
