name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a main-branch run after it has created a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release-please:
    name: Release Please
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-checks:
    name: Check release revision
    needs: release-please
    if: >-
      needs.release-please.outputs.release-created == 'true' &&
      needs.release-please.outputs.sha != github.sha
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}
      artifact-name: release-bundle

  publish:
    name: Publish release
    needs: [checks, release-please, release-checks]
    if: >-
      always() && !cancelled() &&
      needs.checks.result == 'success' &&
      needs.release-please.result == 'success' &&
      needs.release-please.outputs.release-created == 'true' &&
      (needs.release-checks.result == 'success' ||
       (needs.release-checks.result == 'skipped' &&
        needs.release-please.outputs.sha == github.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - name: Verify checked release revision
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          CHECKED_SHA: ${{ needs.release-checks.outputs.checked-sha || needs.checks.outputs.checked-sha }}
        run: test "$RELEASE_SHA" = "$CHECKED_SHA"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - name: Download checked CLI bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-please.outputs.sha == github.sha && 'checked-bundle' || 'release-bundle' }}
          path: release
      - name: Attach CLI bundle and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
        run: |
          cd release
          sha256sum merge-queue-bot-linux-x64.tar.gz > merge-queue-bot-linux-x64.tar.gz.sha256
          gh release upload "$RELEASE_TAG" \
            merge-queue-bot-linux-x64.tar.gz \
            merge-queue-bot-linux-x64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Container metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag-name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag-name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.revision=${{ needs.release-please.outputs.sha }}
      - name: Publish container
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
