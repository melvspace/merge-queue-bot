name: CI

on:
  push:
    branches: ['**', '!release-please--**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a main-branch run after it has created a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    if: "!startsWith(github.head_ref, 'release-please--')"
    uses: ./.github/workflows/checks.yml

  release-please:
    name: Release Please
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create Release Please app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-checks:
    name: Check release revision
    needs: release-please
    if: >-
      needs.release-please.outputs.release-created == 'true' &&
      needs.release-please.outputs.sha != github.sha
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}
      artifact-name: release-bundle

  publish:
    name: Publish release
    needs: [checks, release-please, release-checks]
    if: >-
      always() && !cancelled() &&
      needs.checks.result == 'success' &&
      needs.release-please.result == 'success' &&
      needs.release-please.outputs.release-created == 'true' &&
      (needs.release-checks.result == 'success' ||
       (needs.release-checks.result == 'skipped' &&
        needs.release-please.outputs.sha == github.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Verify checked release revision
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          CHECKED_SHA: ${{ needs.release-checks.outputs.checked-sha || needs.checks.outputs.checked-sha }}
        run: test "$RELEASE_SHA" = "$CHECKED_SHA"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - name: Download checked CLI bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-please.outputs.sha == github.sha && 'checked-bundle' || 'release-bundle' }}
          path: release
      - name: Attach CLI bundle and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
        run: |
          cd release
          sha256sum merge-queue-bot-linux-x64.tar.gz > merge-queue-bot-linux-x64.tar.gz.sha256
          gh release upload "$RELEASE_TAG" \
            merge-queue-bot-linux-x64.tar.gz \
            merge-queue-bot-linux-x64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish-container:
    name: Publish container
    needs: [publish, release-please]
    if: always() && !cancelled() && needs.publish.result == 'success'
    uses: ./.github/workflows/publish-container.yml
    permissions:
      contents: read
      packages: write
    with:
      release-tag: ${{ needs.release-please.outputs.tag-name }}
      expected-sha: ${{ needs.release-please.outputs.sha }}
      publish-latest: true
